[project]
name = "tempo-api"
version = "0.1.0"
description = "Tempo API — one FastAPI service exposing REST, the MCP server, and the OAuth 2.1 AS over a shared services/ layer. See docs/03-backend-fastapi.md."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    # Phase 3 (auth/OAuth): authlib verifies Google's OIDC ID token (JWKS/RS256) and
    # provides audited JOSE primitives; httpx makes the Google token/JWKS calls at runtime;
    # python-multipart backs the form-encoded token + consent endpoints.
    "authlib>=1.3",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "mcp>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "black>=24.10",
    "mypy>=1.13",
]

# No [build-system]: this is a uv "virtual" project. Dependencies are installed
# into .venv, but the `app` package is imported via sys.path (see pytest pythonpath),
# not installed. Keeps the Vercel Python entrypoint (index.py) simple.

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# Line length is enforced by black; let it own wrapping.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts these calls in argument defaults (B008).
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[[tool.mypy.overrides]]
# asyncpg ships no type information (no py.typed); used only in the test harness.
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# authlib ships no py.typed; used for Google ID-token (JWS/JWKS) verification.
module = ["authlib", "authlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    # authlib.jose still ships and is supported until 2.0; docs/05 mandates authlib for
    # Google ID-token verification. Silence its migrate-to-joserfc notice.
    "ignore::authlib.deprecate.AuthlibDeprecationWarning",
    # Auth tests deliberately pass one-shot per-request cookies (distinct identities /
    # with-vs-without comparisons); persisting them on the client would defeat the test.
    "ignore:Setting per-request cookies.*:DeprecationWarning",
]
